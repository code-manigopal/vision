# VISION settings (no secrets here; keys go in .env)

vision:
  owner: Mani
  home_city: Leamington, ON
  timezone: America/Toronto
  host: 127.0.0.1          # localhost only
  port: 8765               # dashboard: http://127.0.0.1:8765
  brief_times: ["06:00", "18:00"]
  cycle_minutes: 15        # default refresh for every master

llm:                       # Ask engine + every agent that writes or judges
  local_base_url: http://localhost:1234/v1   # LM Studio > Developer > Start server
  local_model: "qwen/qwen3-vl-8b"                            # the model id LM Studio shows (a 7-8B instruct model with tool use)
  cloud_provider: anthropic
  cloud_model: ""                            # e.g. a current Claude model id; needs ANTHROPIC_API_KEY in .env
  writer_model: "openai/gpt-oss-120b"        # story writing (YouTube Manager) on Groq; needs GROQ_API_KEY in .env, else cloud, else local
  writer_reasoning: low                      # this model otherwise spends its whole answer on hidden reasoning and returns nothing for long requests

# The master switch. List the masters to run and every other one is switched off (shown "ON HOLD", never run):
#   only_masters: [youtube]            just YouTube Manager
#   only_masters: [youtube, news]      those two
#   only_masters: []                   no override: each master's own `enabled:` below decides
# ids: email, calendar, trading, invest, news, web, jobs, world, ebooks, youtube, visa. Restart VISION after a change.
only_masters: []

# mode: stub = demo agents until that master is built · live = real agents
# trust: OBSERVE | SUGGEST | ACT | HOLD
masters:
  email:
    enabled: true
    trust: SUGGEST         # reads and drafts; sends only after your OK
    mode: live
    cycle_minutes: 15
    options:
      accounts:            # one line per inbox; sign in once from the dashboard's Log in button
        - { id: personal, provider: google }        # google | microsoft
        # - { id: work, provider: microsoft }
      tone: "warm, direct, concise"
      signature: "Mani"
      max_drafts_per_cycle: 3
  calendar:
    enabled: true
    trust: SUGGEST
    mode: live
    cycle_minutes: 15
    options:
      accounts:            # same ids as email; calendar: false to skip one
        - { id: personal, provider: google }
      reminder_minutes: 15
      default_meeting_minutes: 30
      work_start: 9
      work_end: 17
  trading:
    enabled: true
    trust: OBSERVE         # every trade needs your approval
    mode: live
    cycle_minutes: 240
    options:
      instruments: ["EUR_USD"]
      granularity: H4
      risk_pct: 0.5        # of account NAV per trade
      max_units: 1000
      min_units: 100
      approval_ttl_min: 30
      live_trading: false  # practice account only until you set this true AND OANDA_ENV=live
  invest:
    enabled: true
    trust: OBSERVE         # read-only: nothing here can trade
    mode: live
    options:
      brokers: { zerodha: true }          # Fyers turns on when its keys are in .env
      wealthsimple_inbox: inbox/wealthsimple
      csv_stale_days: 7
      targets: {}                         # optional, e.g. { india: 40, us: 40, crypto: 20 }
      ideas_tier: writer                  # who writes "ideas to consider": local (LM Studio) or writer (Groq: faster, but your movers' names and percentages leave the Mac)
      ideas_timeout: 45                   # seconds to wait for the model; after that the ideas come from plain rules
  world:                                  # World Watch: everything VISION watches in the world: news, weather, flights and traffic
    enabled: true
    trust: OBSERVE
    mode: live
    cycle_minutes: 15                     # OpenSky without an account allows about 100 world snapshots a day: 15 min = 96. With OPENSKY_CLIENT_ID/SECRET in .env (about 1,000 a day) 5 is fine
    options:
      home: [42.05, -82.60]
      max_flights: 60
      near_km: 400
      route_lookups: 25
      watch_cities: ["Leamington, ON", "Windsor, ON"]   # traffic (TomTom): incidents in these cities every cycle
      news_minutes: 30                    # the news feeds are read again this often, however often the flights are
      max_age_hours: 30
      # topics: override any Google News search, e.g.
      #   cricket: { query: "India cricket", edition: IN }
      # extra_feeds: add publisher RSS feeds per topic, e.g.
      #   politics: ["https://www.cbc.ca/webfeed/rss/rss-politics"]
      weather: {}                         # defaults to home_city; or { city: "Leamington, ON", lat: 42.05, lon: -82.6 }
  web:
    enabled: true
    trust: SUGGEST
    mode: live
    cycle_minutes: 1440    # once a day
    options:
      radius_km: 10          # starting search radius; doubles by itself (up to max_radius_km: 50) when leads run short
      business_types: [plumber, beauty_salon, hair_care, restaurant, cafe, car_repair, bakery]   # tried first; then any other local business (any_type: false to stop that)
      builds_per_day: 2            # new sites built per day at most
      places_monthly_budget: 800   # Google Places calls allowed per month (searches and detail lookups counted separately)
      stack: 2               # demos kept in play; approving or rejecting a pitch builds the next one
      price: "CAD 500"
      # images_per_site: 6
      # palette_themes: { hair_care: [vintage, gold], cafe: [coffee, cream] }   # ColorHunt themes per type; see vision/masters/skills/color-palettes.md
  jobs:
    enabled: true
    trust: ACT
    mode: live
    cycle_minutes: 360
    options:
      target_titles: ["Data Analyst", "Business Analyst", "Data Analytics Engineer", "Software Engineer", "Senior Software Engineer",
                      "AI Engineer", "AI Automation Engineer", "AI Developer"]
      skills: ["Python", "SQL", "Java", "Spring", "Power BI", "Excel", "Docker", "Kubernetes", "CI/CD", "Jenkins", "Flask", "LLM", "AI agent"]
      free_sources: [jobbank, himalayas, jobicy]   # public feeds with no key; remove one to switch it off
      adzuna_titles: 0                    # Adzuna gives 25 test calls, then charges £8 a month: 0 = don't ask it; 4 = the first four titles each run
      locations: ["Windsor, ON", "Leamington, ON", "Toronto, ON", "Remote"]
      seniority: ["mid", "senior", "lead"]
      exclude: ["unpaid", "commission only"]
      adzuna_where: Ontario
      max_days_old: 14                    # postings from the last 14 days
      region: Ontario                     # only jobs in Ontario; anything else is dropped before scoring
      remote_ok: true                     # also keep remote jobs that say they are open to Canada (workable from Ontario); false = on site or hybrid in Ontario only
      min_match: 70
      max_packages_per_cycle: 2
      tailor_tier: writer                 # who rewords the resume for a posting: cloud (Claude if set up, else LM Studio) or writer (Groq: fast; your work history leaves the Mac, your name and contact lines never do)
      tailor_timeout: 150                 # seconds to wait for it; after that the resume goes into the package as you wrote it
      target_companies: []   # e.g. - { name: Shopify, ats: greenhouse, slug: shopify }   (ats: greenhouse | lever | ashby)
      discover_companies: true            # a posting whose link sits on one of those boards adds that company to the list read on later runs
      discover_max: 40                    # at most this many found companies are read each run
      linkedin: false                     # LinkedIn's public job search, read signed out with a browser's user agent (against its terms; true = on). Off: it answered 429 to the first request on 2026-10-12
      linkedin_titles: 4                  # the first four titles, one results page each, every run
      linkedin_details: 10                # at most this many postings' full text a run
      linkedin_delay: 4                   # seconds between its requests; a refusal stops LinkedIn for a day
      work_status: permit                 # citizen | pr | permit (post-graduation work permit): rules out postings open only to a status you don't hold; empty = not checked
      clearance: false                    # true = you hold a security clearance; false rules out postings that require one
      languages: ["English"]              # add French to keep postings that require it
      followup_days: 10                   # no reply this long after applying: a reminder, at most `followups` of them
      followups: 2
      stale_days: 60                      # after the reminders and this long with no reply, the application is set aside as closed
  ebooks:                 # E-books Manager: KDP paperback coloring books, Grow Kids Max Studio. Pictures on Cloudflare Workers AI (free 10,000 neurons a day), words on Groq
    enabled: false        # on hold until Mani checks Cloudflare's allowance (2026-10-15 afternoon)
    trust: SUGGEST         # makes the whole book; nothing reaches KDP without your yes, and you upload it yourself
    mode: live
    cycle_minutes: 60      # draws until the day's free allowance is used, then carries on after it resets (00:00 UTC = 8 pm Toronto in summer)
    options:
      author: Grow Kids Max Studio
      queue: ["Ocean Animals | 4-8"]   # the next books, in order ("Theme | ages", ages 2-4, 4-8 or 8-12); after these, the theme bank in ebooks.THEMES
      pictures: 30         # pictures per book, each on its own page with a blank back
      spares: 8            # extra scenes written in case a page keeps failing its checks
      tries: 2             # drawings per page per round; the best that passes every check is kept
      rounds: 3            # rounds before a page is dropped and a spare scene takes its place
      min_score: 6         # the vision check's score (0-10) a page must reach
      neuron_budget: 9500  # of Cloudflare's free 10,000 a day; the rest is kept for the cover
      model: openai/gpt-oss-20b   # Groq model for scenes and the listing (its own daily allowance, apart from the YouTube writers)
      trim: [8.5, 11.0]
      price_band: [6.99, 9.99]
  visa:
    enabled: true
    trust: OBSERVE         # only looks at the dates on offer and tells you; you book by hand
    mode: live
    cycle_minutes: 10      # how often it asks "is an account due?"; an account is looked at about once an hour
    options:
      interval_minutes: 60 # one look per account per hour...
      jitter_minutes: 10   # ...give or take this much
      quiet: []            # e.g. ["01:00", "05:00"] = no checks between those times
      test_mode: false     # true = no 5-minute wait between checks, so "Check now" always runs at once; set back to false after testing
  youtube:
    enabled: true
    trust: ACT             # makes Shorts and uploads them as unlisted; you make them public (or delete them) on YouTube
    mode: live
    cycle_minutes: 360     # every six hours: follows up on published Shorts and reads new comments
    run_at: ["23:00 | Mani Market long video | manimarket", "01:00 | Mani Market long video (second try) | manimarket", "03:00 | Know IDK Things long video | knowidk", "05:00 | Know IDK Things Shorts | knowidk", "06:35 | New channels' Shorts | both", "07:02 Asia/Kolkata | Mani Market pre-market Short | manimarket", "18:02 Asia/Kolkata | Mani Market post-market Short | manimarket"]   # 23:00 starts Mani Market Tamil's night (a result video, about an hour of voice); 03:00 makes the day's long video, 05:00 the day's Shorts; each is uploaded and scheduled for release. A time followed by a zone is that zone's clock (India has no daylight saving; the Mac's Toronto does): 07:02 and 18:02 IST make Mani Market Tamil's pre-market and post-market Shorts
    options:
      channels:            # one Director (with its own crew) per channel; the director's name must match catalog.json
        - id: knowidk
          name: Know IDK Things
          backup: true                   # each posted video (and its cover) is copied to Drive, Vision/YouTube/<channel name>/Shorts or /Videos, checked, then removed from the Mac; sign in once at /auth/gdrive/login?account=drive-backup
          director: Know IDK Things Director
          shorts_per_day: 4              # a run keeps making Shorts, one after another, until the day's number is reached or the stories run out
          diagrams: [science, money, story]   # kinds whose Shorts may have animated diagram scenes (HyperFrames); approved by Mani 2026-10-18
          daily_mix: {science: 2, story: 1, money: 1}   # Mani, 2026-10-18: the day's Shorts by category (story = real, classic or original life story; money = finance); replaces shorts_per_day
          mix_auto: true                 # once a week the Analytics Manager re-splits the slots by YouTube Analytics (share watched x views + subscribers, last 28 days), at least 1 each; false = keep daily_mix
          subreddits: [offmychest, TrueOffMyChest]   # needs REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET; or drop .txt files in inbox/stories/knowidk/
          drive_folder: "Know IDK Things Inbox"   # a folder in the Drive of the Google account you sign in with (the channel's); its Docs and .txt files are copied to the inbox
          seconds: [60, 120]
          original_genres: [life, motivational, science, money]   # the kinds of original video, taking turns (science = space, earth, forests, oceans; money = honest money lessons)
          originals: true                # no real story waiting (Drive, inbox, Reddit)? write an original, fictional one from a premise never used before
          ending: hopeful                # hopeful = a heavy story still closes on what was learned or how they moved forward (no invented events) | plain
          voice_engine: edge             # edge (online, exact caption timing) | kokoro (local voices, models/kokoro-v1.0.onnx)
          voice: en-US-GuyNeural         # an edge voice name, or a Kokoro voice id such as am_michael, bm_george, af_heart
          voice_speed: 0.95              # 1.0 = the voice's normal pace
          pause: 0.32                    # seconds of silence after each sentence
          voices:                        # the voice follows the story's mood (the writer names it); a mood not listed uses the voice above
            dark:     { engine: kokoro, voice: am_onyx,   speed: 0.90, pause: 0.45 }
            sad:      { engine: kokoro, voice: af_heart,  speed: 0.90, pause: 0.45 }
            warm:     { engine: kokoro, voice: af_bella,  speed: 0.95, pause: 0.32 }
            light:    { engine: kokoro, voice: am_puck,   speed: 1.00, pause: 0.25 }
            dramatic: { engine: kokoro, voice: am_fenrir, speed: 0.95, pause: 0.35 }
          outro: "Have a story to share? Drop it in the comments, it could be our next video. Subscribe to Know IDK Things."   # spoken at the end of every Short
          cta: "Have a story to share? Drop it in the comments. It could be our next video."            # in every description, and posted as the channel's comment
          viewer_comments: true          # long comments under the channel's own Shorts become stories (screened like any other), ahead of everything else
          classics: [2776, 2518, 269, 38025]   # Project Gutenberg book ids: O. Henry, Tagore, Saki, Tolstoy (public domain); each story is retold once, with its citation
          classics_per_day: 1
          playlists: { classic: "Classic Stories", science: "Science Stories", motivational: "Motivational Stories", money: "Money Lessons" }   # story kind -> playlist (kinds: classic, original, viewer, real); created on the channel if missing
          logo: assets/brand/know-idk-things.png   # the channel logo (png with transparency, from the repo root) as the watermark, top right; blank = the channel name
          music: true                    # a quiet track from assets/bgm/<mood>/ under the narration (fill with: python -m vision bgm)
          music_volume: 0.12             # against the voice at 1.0
          motion: true                   # a slow zoom on stock clips so a still-looking clip moves
          caption_styles: true           # caption font and colours follow the story's mood (ten fonts: python -m vision fonts)
          sfx: true                      # a sound effect only on a line that needs one, chosen by that line's mood (riser, impact, heartbeat, ding...); most lines get none (python -m vision sfx)
          sfx_volume: 0.35               # against the voice at 1.0
          quick:                         # a 20-35 second Short among the day's Shorts; original stories only
            per_day: 1                   # 0 = off
          trends: true                   # reads YouTube's most-watched list twice a day: lesson subjects that touch it are made first, and it informs titles
          trend_region: US
          double_down: true              # once 12 videos have views, the story kinds and lesson patterns that get more views are made more often (explore: 0.15 keeps the rest alive)
          long:                          # one long video a day beside the Shorts: wide 1920x1080, a classic retold chapter by chapter, with its own cover
            enabled: true
            minutes: [6, 9]              # target length
            publish_time: "20:00"        # its own daily release time; never takes a Short's slot
            playlist: "Long Stories"
            create_after: "03:00"        # made in the 03:00 run, apart from the Shorts, so the two don't compete for stock footage
          privacy: scheduled             # scheduled = no review: each Short goes public by itself at the next free publish_times slot | unlisted | public
          publish_times: ["06:00", "12:00", "18:00", "00:00"]   # local time; one Short per slot (6 AM, noon, 6 PM, midnight)
          create_after: "05:00"          # the day's Shorts are not started before this hour (a run earlier in the night only follows up)
          generator: {}                  # AI footage for beats with no stock match, e.g. { provider: name, kind: image, key_env: NAME_API_KEY } (see vision/services/genmedia.py)
        - id: cosmicroadster                      # Mani, 2026-10-19: a new English channel, its own Google Cloud project (COSMICROADSTER_GOOGLE_CLIENT_ID/SECRET in .env)
          name: Cosmic Roadster
          director: Cosmic Roadster Director
          writer_model: openai/gpt-oss-20b       # its own Groq model (own daily allowance)
          daily_mix: {space: 2}           # Shorts only, 2 a day to start
          mix_auto: false
          originals: true
          original_genres: [space]
          avoid_others: true             # never a subject another channel told in the last 90 days
          diagrams: [space]
          privacy: scheduled
          timezone: UTC
          publish_times: ["02:00", "14:00"]   # UTC: US evening / Asia morning, and Europe afternoon / India evening / US morning
          create_after: "06:30"
          voice_engine: kokoro
          voice: am_michael
          voice_speed: 1.0
          pause: 0.28
          voices: {}
          seconds: [45, 90]
          outro: "Follow Cosmic Roadster for one more wonder of the universe, every day."
          cta: ""
          viewer_comments: false
          subreddits: []
          classics: []
          drive_folder: ""
          long: {enabled: false}
          quick: {per_day: 0}
          trends: true
          trend_region: US
          backup: true
          logo: assets/brand/cosmic-roadster/watermark.png
          playlists: {space: "Space Facts"}
          footage_first: [nasa]          # NASA's public-domain photos and video before stock footage
        - id: knowbodythings                      # Mani, 2026-10-19: a new English channel, its own Google Cloud project (KNOWBODYTHINGS_GOOGLE_CLIENT_ID/SECRET in .env)
          name: Know Body Things
          director: Know Body Things Director
          writer_model: openai/gpt-oss-20b       # its own Groq model (own daily allowance)
          daily_mix: {body: 2}           # Shorts only, 2 a day to start
          mix_auto: false
          originals: true
          original_genres: [body]
          avoid_others: true             # never a subject another channel told in the last 90 days
          diagrams: [body]
          privacy: scheduled
          timezone: UTC
          publish_times: ["02:00", "14:00"]   # UTC: US evening / Asia morning, and Europe afternoon / India evening / US morning
          create_after: "06:30"
          voice_engine: kokoro
          voice: bf_emma
          voice_speed: 1.0
          pause: 0.28
          voices: {}
          seconds: [45, 90]
          outro: "Follow Know Body Things to learn one more thing about your body, every day."
          cta: ""
          viewer_comments: false
          subreddits: []
          classics: []
          drive_folder: ""
          long: {enabled: false}
          quick: {per_day: 0}
          trends: true
          trend_region: US
          backup: true
          logo: assets/brand/know-body-things/watermark.png
          playlists: {body: "Body Facts"}
        - id: campingonsatellites                      # Mani, 2026-10-19: a new English channel, its own Google Cloud project (CAMPINGONSATELLITES_GOOGLE_CLIENT_ID/SECRET in .env)
          name: Camping on Satellites
          director: Camping on Satellites Director
          writer_model: qwen/qwen3.8-27b       # its own Groq model (own daily allowance)
          daily_mix: {geography: 2}           # Shorts only, 2 a day to start
          mix_auto: false
          originals: true
          original_genres: [geography]
          avoid_others: true             # never a subject another channel told in the last 90 days
          diagrams: [geography]
          privacy: scheduled
          timezone: UTC
          publish_times: ["02:00", "14:00"]   # UTC: US evening / Asia morning, and Europe afternoon / India evening / US morning
          create_after: "06:30"
          voice_engine: kokoro
          voice: bm_george
          voice_speed: 1.0
          pause: 0.28
          voices: {}
          seconds: [45, 90]
          outro: "Follow Camping on Satellites to see one more corner of the world, every day."
          cta: ""
          viewer_comments: false
          subreddits: []
          classics: []
          drive_folder: ""
          long: {enabled: false}
          quick: {per_day: 0}
          trends: true
          trend_region: US
          backup: true
          logo: assets/brand/camping-on-satellites/watermark.png
          playlists: {geography: "World Facts"}
        - id: manimarket
          name: Mani Market Tamil
          backup_folder: mani_market_yt   # on: each posted video (and its cover) is copied to Drive, Vision/YouTube/<channel name>/Shorts or /Videos (this older top-level folder is moved in there once), checked, then removed from the Mac; sign in once at /auth/gdrive/login?account=drive-backup
          director: Mani Market Tamil Director
          crew: market                   # its own crew (vision/masters/market_crew.py): a quarterly result from NSE's filings, told in Tanglish over slides
          language: ta
          privacy: scheduled             # Mani, 2026-10-14 (reviewed one of every kind): results and analysis are scheduled for the next 10:00 IST slot with no review | approval = private until you approve it. Lessons too: Mani approved everything on this channel (2026-10-14)
          report_privacy: scheduled       # Mani, 2026-10-14 (reviewed one of every kind): a report is only good for about 12 hours, so it publishes with no review, held back only when a data or voice check fails | the pre-market / post-market Shorts: approval = private until you approve (a pre-market one after 09:10 IST is stale and never published) | scheduled = published with NO review (pre-market 15 minutes after it is ready if before 09:10 IST, post-market at 21:00 IST), held back only when a data or voice check fails; not decided yet
          timezone: Asia/Kolkata         # release slots are this zone's wall time
          voice_engine: clone            # clone = Mani's own voice (about an hour a video) | edge = Edge's Tamil voice (fast, artificial)
          free_memory: true              # clone only: LM Studio's model is unloaded while the voice is made, then loaded again
          short_voice_speed: 1.2         # clone only: Shorts are spoken a little slower than long videos (which stay at 1.3, the pace Mani approved)
          reword: false                  # false = the template wording is what Mani approved, said as written | true = the writer model may rephrase lines (numbers are guarded)
          animated: true                 # the slides move with the voice and the presenter points and reacts (HyperFrames); needs `python -m vision hyperframes`; approved by Mani 2026-10-18
          captions: true                 # English captions burned into every video and Short (and captions.srt beside it); written by code beside each Tamil line, no model
          make_after: "23:00"            # a video is started only between these hours (a manual run ignores them)
          make_before: "02:30"           # ends before 03:00 so its voice (cloned model, ~5 GB) never runs beside Know IDK Things' long video (Mani, 2026-10-14)
          per_run: 1                     # videos made a night
          pattern: {mon: analysis, tue: topic, wed: analysis, thu: topic, fri: analysis, sat: analysis, sun: topic}   # the long video by the weekday it is RELEASED on (IST): analysis = one company's ratios from its filings; topic is not built yet (a result is made instead)
          lessons: true                  # topic days (tue, thu, sun in `pattern`) make a finance lesson from official pages (vision/masters/lessons.py); a fresh result is the fallback when none can be made. Always needs your approval
          lesson_shorts: true            # on a day the market is shut (Sat, Sun, NSE holiday) the two Short slots make a lesson Short (made in the 07:00 and 18:00 IST windows, released 09:00 and 21:00 IST); always needs your approval
          lesson_channels:               # Indian finance channels whose recent videos show which topics people watch: their titles only rank the topic bank, and (below) their public transcripts are raw material. Edit freely; a name that does not resolve is skipped
            - CA Rachana Phadke Ranade
            - Labour Law Advisor
            - Asset Yogi
            - Pranjal Kamra
            - Ankur Warikoo
            - Finance With Sharan
            - Almost Everything
            - Madurai Veeran Money Coach   # Tamil (Mani, 2026-10-14)
            - Akshat Shrivastava
            - Money Pechu                # Tamil; could not be checked (needs the YouTube lookup, 100 quota units a name, once): remove it if it resolves to the wrong channel
          lesson_model: "qwen/qwen3.8-27b"               # blank = the usual writer model; writes the lesson in English (the slides and lines, each backed by quoted sentences): about 7,000 tokens for a lesson, 3,000 for a Short. Groq's free day is 200,000 PER MODEL, shared with every other writer in VISION: name another Groq model here (e.g. openai/gpt-oss-20b) to give lessons an allowance of their own
          lesson_min_lines: 8            # a lesson needs this many checked spoken lines or the topic waits (official pages are thin for some topics)
          lesson_tamil_model: "qwen/qwen3.8-27b"   # turns the verified English lines into spoken Tanglish (about 5,000 tokens a lesson, on its own daily allowance); if it is unavailable the writer model is asked instead
          transcripts_per_day: 10        # public transcripts of the videos that matched tonight's topic, read as raw material for the angle and viewers' questions, never for wording or facts (Mani's call, against YouTube's terms: no sign-in, no cookies, no proxy, 5 s apart, any block stops it for the day)
          price_lag_days: 31             # analysis videos use a share price at least this old: SEBI bars an education-only creator from a named stock's price of the last 30 days
          index_csv: https://nsearchives.nseindia.com/content/indices/ind_niftylargemidcap250list.csv   # the companies it covers (NSE's index list; read once a week)
          publish_times: ["09:00", "21:00"]   # IST; for the Shorts (not built yet)
          long:
            publish_time: "10:00"        # IST; one result video a day
            playlist: ""                 # none
          category: "27"                 # Education

voice:                     # local voice (install requirements-voice.txt); browser = use the browser's voice
  tts: kokoro              # kokoro | piper | macos | browser
  kokoro_voice: af_heart
  kokoro_model: models/kokoro-v1.0.onnx
  kokoro_voices: models/voices-v1.0.bin
  macos_voice: Serena
  stt: browser             # whisper | browser
  whisper_model: mlx-community/whisper-small-mlx
  wake: false              # true = listen for the wake word on the Mac's mic
  wake_model: hey_jarvis   # built-in model; or a path to your own trained "hey viz" .onnx
  wake_threshold: 0.5

telegram:                  # token + chat ID live in .env; blank = Telegram stays off
  alerts: true             # instant alerts for agent errors and approvals
